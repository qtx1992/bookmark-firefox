<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark 简洁书签</title>
  <link rel="stylesheet" href="popup.css">
  <script src="boot.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 1024 1024" aria-hidden="true">
          <path d="M188.66 906.63 V194.69 a77.32 77.32 0 0 1 77.32 -77.32 H758.02 a77.32 77.32 0 0 1 77.32 77.32 V906.63 L512 724.88 Z"
                fill="none" stroke="currentColor" stroke-width="91.38"
                stroke-linejoin="round" stroke-linecap="round"></path>
        </svg>
        <span class="brand-name">Bookmark</span>
      </div>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="currentColor" stroke-width="1.7"></circle>
          <path d="M12.6 12.6 17 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索书签…" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" title="清空搜索" hidden>×</button>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="menuBtn" title="菜单">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="4.5" r="1.5" fill="currentColor"></circle>
            <circle cx="10" cy="10" r="1.5" fill="currentColor"></circle>
            <circle cx="10" cy="15.5" r="1.5" fill="currentColor"></circle>
          </svg>
        </button>
      </div>
    </header>

    <div class="subbar">
      <nav class="breadcrumb" id="breadcrumb" aria-label="路径">
        <div class="breadcrumb-items" id="breadcrumbItems"></div>
        <button class="crumb-back" id="backButton" title="返回上级 (Alt+←)">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </nav>

      <div class="search-summary" id="searchSummary" hidden>
        <span id="searchSummaryText"></span>
        <button class="link-btn" id="searchReset">返回当前目录</button>
      </div>
    </div>

    <main class="content">
      <div class="scroll-wrap" id="scrollWrap">
        <div class="grid" id="bookmarkGrid"></div>
        <div class="empty" id="emptyState" hidden>
          <div class="empty-icon">📖</div>
          <p class="empty-title">这里没有书签</p>
          <p class="empty-hint">在 Firefox 里往这个文件夹添加书签后会自动出现</p>
        </div>
      </div>
      <div class="size-hint" id="sizeHint" hidden></div>
    </main>

    <div class="statusbar">
      <span id="statusText">就绪</span>
      <span class="statusbar-right">
        <label class="toggle" id="autoCloseToggle" title="打开书签后自动关闭本窗口">
          <input type="checkbox" id="autoCloseInput">
          <span class="toggle-track"><span class="toggle-dot"></span></span>
          <span class="toggle-text">自动关闭</span>
        </label>
        <span class="statusbar-sep"></span>
        <span id="statusCount"></span>
        <span class="scroll-hint" id="statusScrollHint" hidden></span>
      </span>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu" hidden>
    <button class="menu-row" data-action="open">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 12.5 16.5 4M11 4h5.5v5.5M15 12.2v3.3a1.5 1.5 0 0 1-1.5 1.5H4.8a1.5 1.5 0 0 1-1.5-1.5V6.8a1.5 1.5 0 0 1 1.5-1.5h3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="menu-label">打开</span>
    </button>
    <button class="menu-row" data-action="edit">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m12.7 3.9 3.4 3.4M4 16h3.4L16 7.4a2.4 2.4 0 0 0-3.4-3.4L4 12.6V16Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="menu-label">编辑</span>
    </button>
    <button class="menu-row" data-action="copy">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="9.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.6 7V4.9a1.4 1.4 0 0 0-1.4-1.4H4.9a1.4 1.4 0 0 0-1.4 1.4v6.3a1.4 1.4 0 0 0 1.4 1.4H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="menu-label">复制链接</span>
    </button>
    <div class="menu-sep"></div>
    <button class="menu-row" data-action="moveUp">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V5m0 0 4 4m-4-4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="menu-label">移到上级文件夹</span>
    </button>
    <button class="menu-row danger" data-action="delete">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 6h11M8 6V4.4c0-.6.5-1.1 1.1-1.1h1.8c.6 0 1.1.5 1.1 1.1V6M6.4 6l.6 9.1c0 .8.7 1.4 1.5 1.4h3c.8 0 1.5-.6 1.5-1.4L13.6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="menu-label">删除</span>
    </button>
  </div>

  <!-- 主菜单 -->
  <div class="main-menu" id="mainMenu" hidden>
    <button class="menu-row" data-action="refresh">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.9-4.4M16 3.6v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="menu-label">刷新书签</span>
    </button>
    <button class="menu-row" data-action="size">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M11.5 3.5h5v5M16 4l-5.4 5.4M8.5 16.5h-5v-5M4 15.6 9.4 10.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="menu-label">窗口尺寸…</span>
    </button>
    <div class="menu-sep"></div>
    <button class="menu-row" data-action="settings">
      <svg class="menu-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 3.2v1.6M10 15.2v1.6M3.2 10h1.6M15.2 10h1.6M5.2 5.2l1.1 1.1M13.7 13.7l1.1 1.1M14.8 5.2l-1.1 1.1M6.3 13.7l-1.1 1.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="menu-label">扩展设置</span>
    </button>
  </div>

  <!-- 窗口尺寸面板 -->
  <div class="size-pop" id="sizePop" hidden>
    <div class="size-pop-head">
      <strong>窗口尺寸</strong>
      <span id="sizeCurrent">680 × 600</span>
    </div>

    <div class="preset-row" id="sizePresets"></div>

    <div class="size-fields">
      <label>宽 <input type="number" id="sizeW" min="480" max="1600" step="10"></label>
      <label>高 <input type="number" id="sizeH" min="360" max="1200" step="10"></label>
    </div>

    <p class="size-tip" id="sizeTip">
      拖窗口边框也能调，尺寸会被记住。
    </p>

    <div class="size-actions">
      <button class="btn ghost" id="sizeCancel">取消</button>
      <button class="btn primary" id="sizeApply">应用</button>
    </div>
  </div>

  <!-- 编辑对话框 -->
  <div class="overlay" id="editOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="editTitle">编辑书签</h3>
      <label class="field">
        <span>名称</span>
        <input type="text" id="editName" autocomplete="off">
      </label>
      <label class="field" id="urlField">
        <span>网址</span>
        <input type="text" id="editUrl" autocomplete="off" spellcheck="false">
      </label>
      <div class="modal-actions">
        <button class="btn ghost" id="editCancel">取消</button>
        <button class="btn primary" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div class="overlay" id="confirmOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="confirmTitle">确认</h3>
      <p class="modal-text" id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="confirmCancel">取消</button>
        <button class="btn danger" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
